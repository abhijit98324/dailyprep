  function startQuizById(quizId, isMock) {
    var u = getUser();
    if (!u) { go('auth'); return; }
    var db = loadDb();
    var qz = db.quizzes.find(function (x) { return x.id === quizId; });
    if (!qz) { setFlash('err', 'Quiz not found.'); render(); return; }
    if (isMock && !isPremium(u)) { state.paywallOpen = true; render(); return; }

    var qs = qz.questionIds.map(function (id) {
      return db.questions.find(function (q) { return q.id === id; });
    }).filter(Boolean);

    var limitNotice = '';
    if (!isMock && !isPremium(u)) {
      var used = u.dailyUsageDate === todayStr() ? (u.dailyQuestionsUsed || 0) : 0;
      var rem = Math.max(0, FREE_DAILY_LIMIT - used);
      if (rem <= 0) { state.paywallOpen = true; render(); return; }
      if (qs.length > rem) {
        qs = qs.slice(0, rem);
        limitNotice = 'Free plan: showing ' + rem + ' questions today. Upgrade to Premium (₹200/month) for full quizzes.';
      }
    }

    if (!qs.length) { setFlash('err', 'No published questions in this test yet.'); render(); return; }

    clearTimer();
    state.activeQuiz = qz;
    state.activeQuestions = qs;
    state.qIndex = 0;
    state.answers = {};
    state.marked = {};
    state.visited = { 0: true };
    state.revealed = {};
    state.timings = {};
    state.perQuestionSec = 0;
    state.secondsLeft = (qz.durationMinutes || 15) * 60;
    state.route = isMock ? 'mock-player' : 'quiz-player';
    state.flash = limitNotice ? { type: 'ok', msg: limitNotice } : { type: '', msg: '' };

    state.timerId = setInterval(function () {
      var curQ = state.activeQuestions[state.qIndex];
      if (curQ) state.timings[curQ.id] = (state.timings[curQ.id] || 0) + 1;
      state.perQuestionSec += 1;
      if (state.route === 'mock-player') {
        state.secondsLeft -= 1;
        var tEl = document.getElementById('dp-mock-timer');
        if (tEl) tEl.textContent = formatSec(Math.max(0, state.secondsLeft));
        if (state.secondsLeft <= 0) {
          submitActiveAttempt();
        }
      } else {
        var ptEl = document.getElementById('dp-q-timer');
        if (ptEl) ptEl.textContent = state.perQuestionSec + 's';
      }
    }, 1000);

    render();
  }

  function startDailyQuizForExam(examId) {
    var u = getUser();
    if (!u) { go('auth'); return; }
    var db = loadDb();
    var targetExam = examId || u.primaryExam || 'ssc';
    var today = todayStr();
    var dailyQuizzes = db.quizzes.filter(function (q) {
      return q.type === 'daily' && q.examId === targetExam && q.status === 'published';
    });
    var exact = dailyQuizzes.find(function (q) { return q.scheduledDate === today; });
    if (exact) { startQuizById(exact.id, false); return; }
    dailyQuizzes.sort(function (a, b) { return String(b.scheduledDate || '').localeCompare(String(a.scheduledDate || '')); });
    if (dailyQuizzes.length) {
      startQuizById(dailyQuizzes[0].id, false);
      setFlash('ok', "No quiz scheduled specifically for today — loaded the most recent daily quiz (" + (dailyQuizzes[0].scheduledDate || 'recent') + ').');
      render();
      return;
    }
    var fallbackQs = db.questions.filter(function (q) { return q.examId === targetExam && q.status === 'published'; });
    if (!fallbackQs.length) {
      setFlash('err', 'No daily quiz or questions available for this exam yet. Admin can add them in the Admin tab.');
      render();
      return;
    }
    var tempQuiz = {
      id: 'ad_hoc_' + targetExam, type: 'daily', examId: targetExam,
      title: targetExam.toUpperCase() + ' Practice Quiz', scheduledDate: today,
      durationMinutes: 15, positiveMarks: 2, negativeMarks: 0.5,
      questionIds: fallbackQs.slice(0, 10).map(function (x) { return x.id; }), status: 'published'
    };
    db.quizzes.push(tempQuiz);
    saveDb(db);
    startQuizById(tempQuiz.id, false);
  }

  function submitActiveAttempt() {
    clearTimer();
    var u = getUser();
    var qz = state.activeQuiz;
    var qs = state.activeQuestions;
    if (!u || !qz || !qs.length) return;
    var db = loadDb();
    var uIdx = db.users.findIndex(function (x) { return x.id === u.id; });
    if (uIdx === -1) return;

    var pos = Number(qz.positiveMarks != null ? qz.positiveMarks : 1);
    var neg = qz.type === 'mock' ? Number(qz.negativeMarks != null ? qz.negativeMarks : 0.25) : 0;
    var correct = 0, wrong = 0, skipped = 0, totalTime = 0;
    var secBreak = {}, topicBreak = {};

    qs.forEach(function (q) {
      var ans = state.answers[q.id];
      var t = Number(state.timings[q.id] || 0);
      totalTime += t;
      if (!secBreak[q.subject]) secBreak[q.subject] = { correct: 0, wrong: 0, total: 0 };
      if (!topicBreak[q.topic]) topicBreak[q.topic] = { correct: 0, total: 0 };
      secBreak[q.subject].total += 1;
      topicBreak[q.topic].total += 1;
      if (!ans) { skipped += 1; }
      else if (ans === q.correctOption) {
        correct += 1;
        secBreak[q.subject].correct += 1;
        topicBreak[q.topic].correct += 1;
      } else {
        wrong += 1;
        secBreak[q.subject].wrong += 1;
      }
    });

    var score = Math.round((correct * pos - wrong * neg) * 100) / 100;
    var maxScore = Math.round(qs.length * pos * 100) / 100;
    var attempted = correct + wrong;
    var accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;

    var attempt = {
      id: uid('att'),
      userId: u.id,
      quizId: qz.id,
      quizTitle: qz.title,
      quizType: qz.type,
      examId: qz.examId,
      answers: Object.assign({}, state.answers),
      timings: Object.assign({}, state.timings),
      score: score,
      maxScore: maxScore,
      correctCount: correct,
      wrongCount: wrong,
      skippedCount: skipped,
      attemptedCount: attempted,
      totalQuestions: qs.length,
      accuracy: accuracy,
      totalTime: totalTime,
      sectionBreakdown: secBreak,
      topicBreakdown: topicBreak,
      date: todayStr(),
      createdAt: new Date().toISOString()
    };

    db.attempts.unshift(attempt);

    var usr = db.users[uIdx];
    var today = todayStr();
    var yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
    if (usr.lastActiveDate !== today) {
      usr.streak = usr.lastActiveDate === yesterday ? (usr.streak || 0) + 1 : 1;
      usr.lastActiveDate = today;
    }
    if (usr.dailyUsageDate !== today) {
      usr.dailyUsageDate = today;
      usr.dailyQuestionsUsed = 0;
    }
    if (qz.type === 'daily') usr.dailyQuestionsUsed += qs.length;
    usr.totalPracticed = (usr.totalPracticed || 0) + attempted;
    if (!usr.topicStats) usr.topicStats = {};
    Object.keys(topicBreak).forEach(function (tp) {
      if (!usr.topicStats[tp]) usr.topicStats[tp] = { correct: 0, total: 0 };
      usr.topicStats[tp].correct += topicBreak[tp].correct;
      usr.topicStats[tp].total += topicBreak[tp].total;
    });

    // Leaderboard daily & weekly
    [['daily', today], ['weekly', weekKey()]].forEach(function (pair) {
      var pType = pair[0], pKey = pair[1];
      var lbIdx = db.leaderboard.findIndex(function (l) {
        return l.userId === u.id && l.examId === qz.examId && l.periodType === pType && l.periodKey === pKey;
      });
      if (lbIdx === -1) {
        db.leaderboard.push({ id: uid('lb'), userId: u.id, displayName: usr.displayName, examId: qz.examId, periodType: pType, periodKey: pKey, score: Math.max(0, score) });
      } else {
        db.leaderboard[lbIdx].score = Math.round((db.leaderboard[lbIdx].score + Math.max(0, score)) * 100) / 100;
      }
    });

    saveDb(db);
    state.lastResultId = attempt.id;
    state.route = 'results';
    render();
  }

  }

  function renderResults(db) {

      '<div class="dp-card"><div class="dp-muted" style="font-size:12px;">Accuracy</div><div style="font-size:22px;font-weight:800;">' + att.accuracy + '%</div></div>' +

        var r = att.sectionBreakdown[sec];

      }).join('') +
      '</tbody></table></div>' +

      '<div class="dp-card"><h3 style="margin:0 0 10px;">Answer Key & Explanations</h3>' +

          '<div style="font-size:13px;margin-bottom:4px;">Your Answer: <strong>' + esc(ua || 'Skipped') + '</strong> · Correct: <strong style="color:var(--dp-green);">' + esc(q.correctOption) + '</strong>' +
          (ua ? (ok ? ' <span class="dp-badge dp-badge-green">Correct</span>' : ' <span class="dp-badge dp-badge-red">Wrong</span>') : '') + '</div>' +
          '<div class="dp-muted" style="font-size:13px;">' + esc(q.explanation) + '</div></div>';

  function renderDashboard(db, u) {
    var myAtts = db.attempts.filter(function (a) { return a.userId === u.id; });
    var chartPts = myAtts.slice(0, 8).reverse();
    var svgChart = '';
    if (chartPts.length >= 1) {
      var W = 520, H = 150, pad = 20;
      var pts = chartPts.map(function (a, i) {
        var x = chartPts.length === 1 ? W / 2 : pad + (i * (W - pad * 2)) / (chartPts.length - 1);
        var pct = a.maxScore > 0 ? Math.max(0, Math.min(100, (a.score / a.maxScore) * 100)) : 0;
        var y = H - pad - (pct / 100) * (H - pad * 2);
        return { x: x, y: y, label: Math.round(pct) + '%' };
      });
      var poly = pts.map(function (p) { return p.x + ',' + p.y; }).join(' ');
      svgChart = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-height:170px;">' +
        '<polyline fill="none" stroke="var(--dp-primary)" stroke-width="3" points="' + poly + '" />' +
        pts.map(function (p) {
          return '<circle cx="' + p.x + '" cy="' + p.y + '" r="4.5" fill="var(--dp-primary)" />' +
            '<text x="' + p.x + '" y="' + (p.y - 8) + '" text-anchor="middle" font-size="10" fill="currentColor">' + p.label + '</text>';
        }).join('') +
        '</svg>';
    }
    var weakTopics = Object.keys(u.topicStats || {}).map(function (t) {
      var st = u.topicStats[t];
      return { topic: t, acc: st.total > 0 ? Math.round((st.correct / st.total) * 100) : 0, total: st.total };
    }).sort(function (a, b) { return a.acc - b.acc; }).slice(0, 5);

    return (
      '<div class="dp-wrap">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">' +
      '<div><h2 style="margin:0;">Welcome, ' + esc(u.displayName) + '</h2><div class="dp-muted" style="font-size:13px;">Primary Exam: <strong>' + esc((u.primaryExam || 'ssc').toUpperCase()) + '</strong> · Language: <strong>' + esc(u.language || 'English') + '</strong></div></div>' +
      '<div style="display:flex;gap:8px;"><button type="button" class="dp-btn dp-btn-outline dp-btn-sm" data-go="onboarding">Change Exam</button>' +
      '<button type="button" class="dp-btn dp-btn-primary dp-btn-sm" id="dp-dash-quiz">Today\'s Quiz</button></div></div>' +

      '<div class="dp-grid dp-grid-4" style="margin-bottom:14px;">' +
      '<div class="dp-card"><div class="dp-muted" style="font-size:12px;">Daily Streak</div><div style="font-size:24px;font-weight:800;">' + (u.streak || 0) + ' days</div></div>' +
      '<div class="dp-card"><div class="dp-muted" style="font-size:12px;">Questions Practiced</div><div style="font-size:24px;font-weight:800;">' + (u.totalPracticed || 0) + '</div></div>' +
      '<div class="dp-card"><div class="dp-muted" style="font-size:12px;">Tests Completed</div><div style="font-size:24px;font-weight:800;">' + myAtts.length + '</div></div>' +
      '<div class="dp-card"><div class="dp-muted" style="font-size:12px;">Plan</div><div style="font-size:24px;font-weight:800;">' + (isPremium(u) ? 'Premium' : 'Free') + '</div></div>' +
      '</div>' +

      '<div class="dp-grid dp-grid-2">' +
      '<div class="dp-card"><h3 style="margin:0 0 8px;">Score Trend (%)</h3>' + (svgChart || '<p class="dp-muted" style="font-size:13px;">Complete a quiz to see your score chart.</p>') + '</div>' +
      '<div class="dp-card"><h3 style="margin:0 0 8px;">Weak Topics to Revise</h3>' +
      (weakTopics.length
        ? weakTopics.map(function (w) {
            return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--dp-border);font-size:13px;"><span>' + esc(w.topic) + '</span><strong>' + w.acc + '% (' + w.total + ' Qs)</strong></div>';
          }).join('')
        : '<p class="dp-muted" style="font-size:13px;">No topic history yet.</p>') +
      '</div></div></div>'
    );
  }

  function render() {
    var root = document.getElementById('dp-root');
    if (!root) return;
    root.className = state.dark ? 'dp-dark' : '';
    var db = loadDb();
    var u = getUser();

    var main = '';
    if (state.route === 'landing') main = renderLanding(db, u);
    else if (state.route === 'auth') main = renderAuth();
    else if (state.route === 'onboarding') main = u ? renderOnboarding(db, u) : renderAuth();
    else if (state.route === 'dashboard') main = u ? renderDashboard(db, u) : renderAuth();
    else if (state.route === 'daily-quiz') main = u ? renderDailyQuizList(db, u) : renderAuth();
    else if (state.route === 'mock-tests') main = u ? renderMockTests(db, u) : renderAuth();
    else if (state.route === 'quiz-player') main = renderQuizOrMockPlayer(db, u, false);
    else if (state.route === 'mock-player') main = renderQuizOrMockPlayer(db, u, true);
    else if (state.route === 'results') main = renderResults(db);
    else if (state.route === 'current-affairs') main = renderCurrentAffairs(db);
    else if (state.route === 'bookmarks') main = u ? renderBookmarks(db, u) : renderAuth();
    else if (state.route === 'leaderboard') main = u ? renderLeaderboard(db) : renderAuth();
    else if (state.route === 'pricing') main = renderPricing(db, u);
    else if (state.route === 'admin') main = renderAdmin(db, u);

    var flashHtml = state.flash.msg
      ? '<div class="dp-wrap" style="padding-bottom:0;"><div class="dp-alert ' + (state.flash.type === 'err' ? 'dp-alert-err' : 'dp-alert-ok') + '">' + esc(state.flash.msg) + '</div></div>'
      : '';

    root.innerHTML =
      renderNavbar(u) +
      flashHtml +
      main +
      '<footer class="dp-footer"><div class="dp-wrap" style="padding:0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
      '<span>DailyPrep — Human-Curated Indian Govt Job Exam Prep</span>' +
      '<span>SSC · Banking · Railways · UPSC & PSC · Defence · Teaching · State Police</span>' +
      '</div></footer>' +
      renderModals();

    bindEvents();
  }

  function bindEvents() {
    var root = document.getElementById('dp-root');
    if (!root) return;

    root.querySelectorAll('[data-go]').forEach(function (el) {
      el.onclick = function () { go(el.getAttribute('data-go')); };
    });

    var themeBtn = document.getElementById('dp-theme-btn');
    if (themeBtn) themeBtn.onclick = function () {
      state.dark = !state.dark;
      localStorage.setItem(THEME_KEY, state.dark ? 'dark' : 'light');
      render();
    };

    var logoutBtn = document.getElementById('dp-logout-btn');
    if (logoutBtn) logoutBtn.onclick = function () {
      localStorage.removeItem(SESSION_KEY);
      go('landing');
    };

    var heroDaily = document.getElementById('dp-hero-daily');
    if (heroDaily) heroDaily.onclick = function () { startDailyQuizForExam(); };
    var dashQuiz = document.getElementById('dp-dash-quiz');
    if (dashQuiz) dashQuiz.onclick = function () { startDailyQuizForExam(); };
    var startTodayBtn = document.getElementById('dp-start-today-q');
    if (startTodayBtn) startTodayBtn.onclick = function () { startDailyQuizForExam(); };

    root.querySelectorAll('[data-play-daily]').forEach(function (el) {
      el.onclick = function () { startQuizById(el.getAttribute('data-play-daily'), false); };
    });
    root.querySelectorAll('[data-play-mock]').forEach(function (el) {
      el.onclick = function () { startQuizById(el.getAttribute('data-play-mock'), true); };
    });

    var tabLogin = document.getElementById('dp-tab-login');
    if (tabLogin) tabLogin.onclick = function () { state.authMode = 'login'; render(); };
    var tabReg = document.getElementById('dp-tab-reg');
    if (tabReg) tabReg.onclick = function () { state.authMode = 'register'; render(); };
    var goForgot = document.getElementById('dp-go-forgot');
    if (goForgot) goForgot.onclick = function () { state.authMode = 'forgot'; state.resetStep = 'request'; render(); };
    var backLogin = document.getElementById('dp-back-login');
    if (backLogin) backLogin.onclick = function () { state.authMode = 'login'; render(); };

    var authForm = document.getElementById('dp-auth-form');
    if (authForm) authForm.onsubmit = function (e) {
      e.preventDefault();
      var email = document.getElementById('dp-a-email').value.trim().toLowerCase();
      var pass = document.getElementById('dp-a-pass').value;
      var db = loadDb();
      if (state.authMode === 'register') {
        var name = document.getElementById('dp-a-name').value.trim();
        if (db.users.some(function (x) { return x.email.toLowerCase() === email; })) {
          setFlash('err', 'An account with this email already exists.'); render(); return;
        }
        var adminRole = email === 'admin@dailyprep.in';
        var nu = {
          id: uid('usr'), email: email, displayName: name || 'Student',
          passwordHash: hashSimple(pass), role: adminRole ? 'admin' : 'student',
          selectedExams: ['ssc'], primaryExam: 'ssc', language: 'English',
          onboarded: adminRole, plan: adminRole ? 'premium' : 'free',
          premiumUntil: null, streak: 0, lastActiveDate: null,
          dailyUsageDate: null, dailyQuestionsUsed: 0, totalPracticed: 0, topicStats: {},
          createdAt: new Date().toISOString()
        };
        db.users.push(nu);
        saveDb(db);
        localStorage.setItem(SESSION_KEY, nu.id);
        go(adminRole ? 'admin' : 'onboarding');
      } else {
        var found = db.users.find(function (x) { return x.email.toLowerCase() === email && x.passwordHash === hashSimple(pass); });
        if (!found) { setFlash('err', 'Invalid email or password.'); render(); return; }
        localStorage.setItem(SESSION_KEY, found.id);
        go(found.role === 'admin' ? 'admin' : (found.onboarded ? 'dashboard' : 'onboarding'));
      }
    };

    var fReqForm = document.getElementById('dp-forgot-req-form');
    if (fReqForm) fReqForm.onsubmit = function (e) {
      e.preventDefault();
      var email = document.getElementById('dp-f-email').value.trim().toLowerCase();
      var db = loadDb();
      var usr = db.users.find(function (x) { return x.email.toLowerCase() === email; });
      if (!usr) { setFlash('err', 'No account found with that email.'); render(); return; }
      var code = String(Math.floor(100000 + Math.random() * 900000));
      db.passwordResets.push({ email: email, codeHash: hashSimple(code), expiresAt: Date.now() + 900000, used: false });
      saveDb(db);
      state.resetEmail = email;
      state.resetDemoCode = code;
      state.resetStep = 'confirm';
      render();
    };

    var fConfForm = document.getElementById('dp-forgot-confirm-form');
    if (fConfForm) fConfForm.onsubmit = function (e) {
      e.preventDefault();
      var email = document.getElementById('dp-fc-email').value.trim().toLowerCase();
      var code = document.getElementById('dp-fc-code').value.trim();
      var pass = document.getElementById('dp-fc-pass').value;
      var db = loadDb();
      var rec = db.passwordResets.slice().reverse().find(function (r) {
        return r.email === email && !r.used && r.expiresAt > Date.now() && r.codeHash === hashSimple(code);
      });
      if (!rec) { setFlash('err', 'Invalid or expired reset code.'); render(); return; }
      var uIdx = db.users.findIndex(function (x) { return x.email.toLowerCase() === email; });
      if (uIdx !== -1) db.users[uIdx].passwordHash = hashSimple(pass);
      rec.used = true;
      saveDb(db);
      state.authMode = 'login';
      state.resetDemoCode = '';
      setFlash('ok', 'Password updated! Please sign in.');
      render();
    };

    var obForm = document.getElementById('dp-onboard-form');
    if (obForm) obForm.onsubmit = function (e) {
      e.preventDefault();
      var checked = Array.from(obForm.querySelectorAll('input[name="dp_exams"]:checked')).map(function (c) { return c.value; });
      if (!checked.length) { setFlash('err', 'Select at least one exam.'); render(); return; }
      var u = getUser();
      var db = loadDb();
      var idx = db.users.findIndex(function (x) { return x.id === u.id; });
      db.users[idx].selectedExams = checked;
      db.users[idx].primaryExam = checked[0];
      db.users[idx].language = document.getElementById('dp-ob-lang').value;
      db.users[idx].onboarded = true;
      saveDb(db);
      go('dashboard');
    };

    // Quiz player controls
    root.querySelectorAll('[data-ans]').forEach(function (el) {
      el.onclick = function () {
        var q = state.activeQuestions[state.qIndex];
        if (!q) return;
        if (state.route === 'quiz-player' && state.revealed[q.id]) return;
        state.answers[q.id] = el.getAttribute('data-ans');
        if (state.route === 'quiz-player') state.revealed[q.id] = true;
        render();
      };
    });
    root.querySelectorAll('[data-jump]').forEach(function (el) {
      el.onclick = function () {
        state.qIndex = Number(el.getAttribute('data-jump'));
        state.perQuestionSec = 0;
        render();
      };
    });
    var prevQ = document.getElementById('dp-prev-q');
    if (prevQ) prevQ.onclick = function () { if (state.qIndex > 0) { state.qIndex -= 1; state.perQuestionSec = 0; render(); } };
    var nextQ = document.getElementById('dp-next-q');
    if (nextQ) nextQ.onclick = function () { if (state.qIndex < state.activeQuestions.length - 1) { state.qIndex += 1; state.perQuestionSec = 0; render(); } };
    var skipQ = document.getElementById('dp-skip-q');
    if (skipQ) skipQ.onclick = function () {
      if (state.qIndex < state.activeQuestions.length - 1) { state.qIndex += 1; state.perQuestionSec = 0; render(); }
      else submitActiveAttempt();
    };
    var markQ = document.getElementById('dp-mark-q');
    if (markQ) markQ.onclick = function () {
      var q = state.activeQuestions[state.qIndex];
      state.marked[q.id] = !state.marked[q.id];
      render();
    };
    var subTest = document.getElementById('dp-submit-test');
    if (subTest) subTest.onclick = submitActiveAttempt;

    var bmBtn = document.getElementById('dp-bm-btn');
    if (bmBtn) bmBtn.onclick = function () {
      var u = getUser(), q = state.activeQuestions[state.qIndex], db = loadDb();
      var idx = db.bookmarks.findIndex(function (b) { return b.userId === u.id && b.questionId === q.id; });
      if (idx === -1) db.bookmarks.unshift({ id: uid('bm'), userId: u.id, questionId: q.id, questionData: q });
      else db.bookmarks.splice(idx, 1);
      saveDb(db); render();
    };
    root.querySelectorAll('[data-rm-bm]').forEach(function (el) {
      el.onclick = function () {
        var u = getUser(), qid = el.getAttribute('data-rm-bm'), db = loadDb();
        db.bookmarks = db.bookmarks.filter(function (b) { return !(b.userId === u.id && b.questionId === qid); });
        saveDb(db); render();
      };
    });

    var repBtn = document.getElementById('dp-rep-btn');
    if (repBtn) repBtn.onclick = function () { state.reportQuestionId = state.activeQuestions[state.qIndex].id; render(); };
    var closeRep = document.getElementById('dp-close-rep');
    if (closeRep) closeRep.onclick = function () { state.reportQuestionId = null; render(); };
    var repForm = document.getElementById('dp-report-form');
    if (repForm) repForm.onsubmit = function (e) {
      e.preventDefault();
      var u = getUser(), db = loadDb();
      var q = db.questions.find(function (x) { return x.id === state.reportQuestionId; });
      db.errorReports.unshift({
        id: uid('rep'), questionId: state.reportQuestionId, questionText: q ? q.question : '',
        userEmail: u.email, reason: document.getElementById('dp-rep-reason').value,
        details: document.getElementById('dp-rep-det').value.trim(), status: 'open', createdAt: new Date().toISOString()
      });
      saveDb(db);
      state.reportQuestionId = null;
      setFlash('ok', 'Error report submitted to admin.');
      render();
    };

    // Paywall & UPI
    var closePw = document.getElementById('dp-close-pw');
    if (closePw) closePw.onclick = function () { state.paywallOpen = false; render(); };
    var goUpi = document.getElementById('dp-go-upi');
    if (goUpi) goUpi.onclick = function () { state.paywallOpen = false; go('pricing'); };
    var copyUpi = document.getElementById('dp-copy-upi');
    if (copyUpi) copyUpi.onclick = function () {
      var db = loadDb();
      if (navigator.clipboard) navigator.clipboard.writeText(db.upiSettings.upiId);
      setFlash('ok', 'Copied UPI ID: ' + db.upiSettings.upiId);
      render();
    };
    var utrForm = document.getElementById('dp-utr-form');
    if (utrForm) utrForm.onsubmit = function (e) {
      e.preventDefault();
      var u = getUser(), db = loadDb();
      var utr = document.getElementById('dp-utr-num').value.trim().toUpperCase();
      db.upiRequests.unshift({
        id: uid('upi'), userId: u.id, userName: u.displayName, userEmail: u.email,
        amountInr: db.upiSettings.monthlyPriceInr, utrNumber: utr,
        upiApp: document.getElementById('dp-utr-app').value, status: 'pending', createdAt: new Date().toISOString()
      });
      saveDb(db);
      setFlash('ok', 'UTR submitted! Admin will approve your Premium access shortly.');
      render();
    };

    // Leaderboard
    var lbEx = document.getElementById('dp-lb-exam');
    if (lbEx) lbEx.onchange = function () { state.lbExam = lbEx.value; render(); };
    var lbD = document.getElementById('dp-lb-daily');
    if (lbD) lbD.onclick = function () { state.lbPeriod = 'daily'; render(); };
    var lbW = document.getElementById('dp-lb-weekly');
    if (lbW) lbW.onclick = function () { state.lbPeriod = 'weekly'; render(); };

    // Admin actions
    root.querySelectorAll('[data-atab]').forEach(function (el) {
      el.onclick = function () { state.adminTab = el.getAttribute('data-atab'); state.editingQuestionId = null; render(); };
    });

    var expJson = document.getElementById('dp-export-json');
    if (expJson) expJson.onclick = function () {
      var blob = new Blob([JSON.stringify(loadDb(), null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'dailyprep-backup.json';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    };
    var impJson = document.getElementById('dp-import-json');
    if (impJson) impJson.onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var parsed = JSON.parse(fr.result);
          if (parsed && Array.isArray(parsed.questions)) { saveDb(parsed); setFlash('ok', 'Backup imported successfully.'); render(); }
        } catch (err) { setFlash('err', 'Invalid JSON backup file.'); render(); }
      };
      fr.readAsText(f);
    };

    var qForm = document.getElementById('dp-q-form');
    if (qForm) qForm.onsubmit = function (e) {
      e.preventDefault();
      var db = loadDb();
      var item = {
        id: state.editingQuestionId || uid('q'),
        examId: document.getElementById('dp-q-exam').value,
        subject: document.getElementById('dp-q-subj').value.trim(),
        topic: document.getElementById('dp-q-topic').value.trim(),
        difficulty: document.getElementById('dp-q-diff').value,
        language: document.getElementById('dp-q-lang').value,
        status: document.getElementById('dp-q-status').value,
        question: document.getElementById('dp-q-text').value.trim(),
        optionA: document.getElementById('dp-q-a').value.trim(),
        optionB: document.getElementById('dp-q-b').value.trim(),
        optionC: document.getElementById('dp-q-c').value.trim(),
        optionD: document.getElementById('dp-q-d').value.trim(),
        correctOption: document.getElementById('dp-q-ans').value,
        explanation: document.getElementById('dp-q-exp').value.trim(),
        createdAt: new Date().toISOString()
      };
      if (state.editingQuestionId) {
        var idx = db.questions.findIndex(function (x) { return x.id === state.editingQuestionId; });
        if (idx !== -1) db.questions[idx] = item;
        state.editingQuestionId = null;
      } else db.questions.unshift(item);
      saveDb(db);
      setFlash('ok', 'Question saved.');
      state.adminTab = 'questions';
      render();
    };
    var cancelEq = document.getElementById('dp-cancel-eq');
    if (cancelEq) cancelEq.onclick = function () { state.editingQuestionId = null; render(); };

    root.querySelectorAll('[data-edit-q]').forEach(function (el) {
      el.onclick = function () { state.editingQuestionId = el.getAttribute('data-edit-q'); state.adminTab = 'add-q'; render(); };
    });
    root.querySelectorAll('[data-del-q]').forEach(function (el) {
      el.onclick = function () {
        var db = loadDb(), id = el.getAttribute('data-del-q');
        db.questions = db.questions.filter(function (q) { return q.id !== id; });
        saveDb(db); render();
      };
    });

    var dlTpl = document.getElementById('dp-dl-csv-tpl');
    if (dlTpl) dlTpl.onclick = function () {
      var csv = 'exam,subject,topic,difficulty,question,optionA,optionB,optionC,optionD,correctOption,explanation,language\nssc,Quantitative Aptitude,Percentage,easy,"What is 25% of 200?",40,50,60,70,B,"25% of 200 = (25/100)*200 = 50.",English\n';
      var blob = new Blob([csv], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'dailyprep-template.csv';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    };
    var csvInput = document.getElementById('dp-csv-file');
    if (csvInput) csvInput.onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        var lines = String(fr.result).split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) { setFlash('err', 'CSV has no data rows.'); render(); return; }
        var db = loadDb(), added = 0;
        for (var i = 1; i < lines.length; i++) {
          var cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
          if (!cols || cols.length < 11) continue;
          var clean = cols.map(function (c) { return c.replace(/^"|"$/g, '').trim(); });
          db.questions.unshift({
            id: uid('q'), examId: clean[0].toLowerCase(), subject: clean[1], topic: clean[2],
            difficulty: clean[3] || 'medium', question: clean[4], optionA: clean[5], optionB: clean[6],
            optionC: clean[7], optionD: clean[8], correctOption: (clean[9] || 'A').toUpperCase(),
            explanation: clean[10], language: clean[11] || 'English', status: 'published', createdAt: new Date().toISOString()
          });
          added++;
        }
        saveDb(db);
        setFlash('ok', 'Imported ' + added + ' questions from CSV.');
        render();
      };
      fr.readAsText(f);
    };

    var qzCreateForm = document.getElementById('dp-quiz-create-form');
    if (qzCreateForm) qzCreateForm.onsubmit = function (e) {
      e.preventDefault();
      var qids = Array.from(qzCreateForm.querySelectorAll('input[name="dp_qz_qids"]:checked')).map(function (c) { return c.value; });
      if (!qids.length) { setFlash('err', 'Pick at least one question.'); render(); return; }
      var db = loadDb();
      var tp = document.getElementById('dp-qz-type').value;
      db.quizzes.unshift({
        id: uid('qz'), type: tp, examId: document.getElementById('dp-qz-exam').value,
        title: document.getElementById('dp-qz-title').value.trim(),
        scheduledDate: tp === 'daily' ? document.getElementById('dp-qz-date').value : null,
        durationMinutes: Number(document.getElementById('dp-qz-dur').value || 15),
        positiveMarks: 2, negativeMarks: Number(document.getElementById('dp-qz-neg').value || 0.5),
        questionIds: qids, status: 'published', createdAt: new Date().toISOString()
      });
      saveDb(db); setFlash('ok', 'Quiz created and published.'); render();
    };
    root.querySelectorAll('[data-del-qz]').forEach(function (el) {
      el.onclick = function () {
        var db = loadDb(), id = el.getAttribute('data-del-qz');
        db.quizzes = db.quizzes.filter(function (x) { return x.id !== id; });
        saveDb(db); render();
      };
    });

    var caForm = document.getElementById('dp-ca-form');
    if (caForm) caForm.onsubmit = function (e) {
      e.preventDefault();
      var db = loadDb();
      var pts = document.getElementById('dp-ca-pts').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      db.currentAffairs.unshift({
        id: uid('ca'), date: document.getElementById('dp-ca-date').value,
        title: document.getElementById('dp-ca-title').value.trim(), points: pts,
        linkedQuestionIds: [], status: 'published', createdAt: new Date().toISOString()
      });
      saveDb(db); setFlash('ok', 'Current Affairs digest published.'); render();
    };
    root.querySelectorAll('[data-del-ca]').forEach(function (el) {
      el.onclick = function () {
        var db = loadDb(), id = el.getAttribute('data-del-ca');
        db.currentAffairs = db.currentAffairs.filter(function (x) { return x.id !== id; });
        saveDb(db); render();
      };
    });

    var exForm = document.getElementById('dp-exam-form');
    if (exForm) exForm.onsubmit = function (e) {
      e.preventDefault();
      var db = loadDb();
      db.exams.push({
        id: document.getElementById('dp-ex-id').value.trim().toLowerCase(),
        shortName: document.getElementById('dp-ex-short').value.trim(),
        name: document.getElementById('dp-ex-name').value.trim(),
        description: document.getElementById('dp-ex-desc').value.trim(),
        subjects: [{ name: 'General', topics: ['General'] }]
      });
      saveDb(db); setFlash('ok', 'Exam category added.'); render();
    };
    root.querySelectorAll('[data-del-ex]').forEach(function (el) {
      el.onclick = function () {
        var db = loadDb(), id = el.getAttribute('data-del-ex');
        db.exams = db.exams.filter(function (x) { return x.id !== id; });
        saveDb(db); render();
      };
    });

    root.querySelectorAll('[data-res-rep]').forEach(function (el) {
      el.onclick = function () {
        var db = loadDb(), id = el.getAttribute('data-res-rep');
        var r = db.errorReports.find(function (x) { return x.id === id; });
        if (r) r.status = 'resolved';
        saveDb(db); render();
      };
    });

    var upiSetForm = document.getElementById('dp-upi-set-form');
    if (upiSetForm) upiSetForm.onsubmit = function (e) {
      e.preventDefault();
      var db = loadDb();
      db.upiSettings.upiId = document.getElementById('dp-upi-id').value.trim();
      db.upiSettings.payeeName = document.getElementById('dp-upi-name').value.trim();
      db.upiSettings.monthlyPriceInr = Number(document.getElementById('dp-upi-price').value || 200);
      saveDb(db); setFlash('ok', 'UPI settings updated.'); render();
    };
    root.querySelectorAll('[data-upi-act]').forEach(function (el) {
      el.onclick = function () {
        var parts = el.getAttribute('data-upi-act').split(':');
        var act = parts[0], id = parts[1], db = loadDb();
        var req = db.upiRequests.find(function (r) { return r.id === id; });
        if (req) {
          req.status = act;
          if (act === 'approved') {
            var usr = db.users.find(function (u) { return u.id === req.userId; });
            if (usr) {
              var next = new Date(); next.setMonth(next.getMonth() + 1);
              usr.plan = 'premium'; usr.premiumUntil = next.toISOString();
            }
          }
          saveDb(db); render();
        }
      };
    });
    root.querySelectorAll('[data-tog-plan]').forEach(function (el) {
      el.onclick = function () {
        var db = loadDb(), id = el.getAttribute('data-tog-plan');
        var usr = db.users.find(function (u) { return u.id === id; });
        if (usr) { usr.plan = usr.plan === 'premium' ? 'free' : 'premium'; saveDb(db); render(); }
      };
    });
  }

  render();
})();
</script>
<!-- BLOGGER COPY-PASTE END -->
</body>
